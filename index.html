  function view() {
    lastRoute = null;
    const loader = '<div class="center"><div class="auth-hero"><div class="loader">' + duck(52) + '</div><p>טוען את החפיפה…</p></div></div>';
    if (loadError) return errorView();
    let m;
    if (useCloud) {
      if (!authReady || pub.owner === undefined || !pub.namesLoaded || !pub.claimsLoaded) return loader;
      if (!authUser || !dataStarted) return pub.owner === null ? setupView() : loginView();
      if (!ready) return loader;
      m = me();
      if (!m) return '<div class="center"><div class="card auth"><div class="auth-hero"><div class="hero-ico">🤔</div><h1>החשבון לא נמצא</h1><p>ייתכן שהמשתמש נמחק. פנו לחופף הראשי.</p></div><button class="btn primary" style="width:100%" data-act="logout">יציאה</button></div></div>';
    } else {
      if (!ready) return loader;
      if (!Object.keys(db.users).length) return setupView();
      m = me();
      if (!m) return loginView();
    }
    const r = resolveRoute(m);
    lastRoute = r;
    let page;
    if (r.page === 't') page = traineePage(db.users[r.tid], m, r.tab);
    else if (r.page === 'reports') page = reportsView(m);
    else if (r.page === 'users') page = usersView(m);
    else if (r.page === 'plan') page = planView();
    else if (r.page === 'holidays') page = holidaysView(m);
    else if (r.page === 'attendance') page = attendanceView(m);
    else page = homeView(m);
    return headerView(m, r) + '<main class="wrap">' + talkBanner(m) + page + '</main>';
  }

  const SYNC_TEXT = { demo: 'מצב הדגמה, שום דבר לא נשמר', local: 'שמור בדפדפן הזה בלבד', connecting: 'מתחבר…', online: 'מסונכרן', offline: 'אין חיבור, נשמר מקומית', error: 'שגיאת סנכרון' };
  const syncPill = () => '<span class="sync ' + syncState + '" title="' + SYNC_TEXT[syncState] + '"><span>' + SYNC_TEXT[syncState] + '</span></span>';

  function headerView(m, r) {
    let links;
    if (m.role === 'trainee') {
      links = [['#/t/' + m.id + '/sprints', 'ההתקדמות שלי', r.tab === 'sprints'], ['#/t/' + m.id + '/questions', 'הצ׳קליסט שלי', r.tab === 'questions'], ['#/t/' + m.id + '/issues', 'דיווחים', r.tab === 'issues'], ['#/t/' + m.id + '/calendar', 'לוח שנה', r.tab === 'calendar']];
    } else {
      links = [['#/home', m.role === 'admin' ? 'נחפפים' : 'הנחפפים שלי', r.page === 'home' || r.page === 't'], ['#/reports', 'דוחות', r.page === 'reports'], ['#/attendance', 'נוכחות', r.page === 'attendance']];
      if (m.role === 'admin') links.push(['#/users', 'משתמשים', r.page === 'users'], ['#/plan', 'תכנית החפיפה', r.page === 'plan'], ['#/holidays', 'חגים', r.page === 'holidays']);
    }
    return '<header class="top"><div class="top-in">' +
      '<a class="brand" href="#/"><span class="brand-ico">' + duck(30) + '</span><span>מסלול החפיפה</span></a>' +
      '<nav class="nav" aria-label="ניווט ראשי">' + links.map(([h, l, on]) => '<a href="' + h + '" class="' + (on ? 'on' : '') + '"' + (on ? ' aria-current="page"' : '') + '>' + l + '</a>').join('') + '</nav>' +
      '<div class="me">' + syncPill() + '<button class="av-btn" data-act="photoEdit" data-id="' + m.id + '" title="תמונת פרופיל" aria-label="תמונת פרופיל">' + avatar(m, 'sm') + '</button>' + '<span class="me-name">' + esc(m.name) + '<small>' + roleName(m) + '</small></span>' +
      (useCloud ? '<button class="icon-btn" data-act="changePw" title="שינוי סיסמה" aria-label="שינוי סיסמה">🔑</button>' : '') +
      '<button class="btn ghost sm" data-act="logout">יציאה</button></div></div></header>';
  }

  /* Reminder on every page for a mentor whose personal talk is today or tomorrow. */
  function talkBanner(m) {
    if (m.role === 'trainee') return '';
    const soon = upcomingTalks(k => k.mentorId === m.id && db.users[k.traineeId]).filter(x => x.d <= addDays(todayISO(), 1));
    if (!soon.length) return '';
    return '<div class="banner" role="status">' + soon.map(x => '<div><span aria-hidden="true">⏰</span> <b>שיחה אישית עם ' + esc(userName(x.k.traineeId)) + '</b> ' + whenText(x.d) +
      (x.k.time ? ' ב-' + esc(x.k.time) : '') + (x.k.note ? ' <span class="muted">· ' + esc(x.k.note) + '</span>' : '') + '</div>').join('') + '</div>';
  }

  function errorView() {
    const msg = loadError === 'rules'
      ? 'Firebase חסם את הגישה. צריך לעדכן את כללי האבטחה (Rules) לפי ההוראות בקובץ README.'
      : 'לא הצלחנו להתחבר ל-Firebase. בדקו את החיבור לאינטרנט ואת ההגדרות בקובץ firebase-config.js.';
    return '<div class="center"><div class="card auth"><div class="auth-hero"><div class="hero-ico">🙈</div><h1>משהו השתבש</h1><p>' + msg + '</p></div><button class="btn primary" style="width:100%" onclick="location.reload()">לנסות שוב</button></div></div>';
  }

  function setupView() {
    return '<div class="center"><div class="card auth">' +
      '<div class="auth-hero"><div class="hero-ico">' + duck(64) + '</div><h1>ברוכים הבאים למסלול החפיפה</h1><p>נתחיל ביצירת החופף הראשי, מי שמנהל את כל החפיפה.</p></div>' +
      '<form data-form="setup" autocomplete="off">' +
      '<label class="field"><span>השם שלך</span><input type="text" name="name" id="su-name" data-keep required maxlength="40"></label>' +
      '<label class="field"><span>סיסמה</span><input type="password" name="pw" required minlength="' + PW_MIN + '" autocomplete="new-password"><small>לפחות ' + PW_MIN + ' תווים</small></label>' +
      '<label class="field"><span>שוב את הסיסמה</span><input type="password" name="pw2" required minlength="' + PW_MIN + '" autocomplete="new-password"></label>' +
      '<p class="err">' + esc(ui.loginErr) + '</p>' +
      '<button class="btn primary" style="width:100%"' + (ui.busy ? ' disabled' : '') + '>' + (ui.busy ? 'רגע…' : 'יצירה והתחלה ✨') + '</button></form>' +
      (useCloud ? '' : '<p class="note-box">האתר עוד לא מחובר ל-Firebase, ולכן הנתונים נשמרים רק בדפדפן הזה. כדי שכל אחד יתחבר מהמחשב שלו, עקבו אחרי ההוראות בקובץ README.</p>') +
      '</div></div>';
  }

  /* Who appears on the login screen, and whether they already chose a password. */
  const loginPeople = () => useCloud ? Object.values(pub.names).sort(byName) : users();
  const hasAccount = u => useCloud ? !!pub.claims[u.id] : !!u.passHash;
  function loginView() {
    const u = ui.loginId && loginPeople().find(x => x.id === ui.loginId);
    let inner;
    if (u) {
      const first = !hasAccount(u);
      inner = '<div class="picked">' + avatar(u, 'lg') + '<div><h2>' + (first ? 'שלום ' + esc(u.name) + '! 👋' : 'היי ' + esc(u.name)) + '</h2><p class="muted">' +
        (first ? 'זו הכניסה הראשונה שלך. ' + (useCloud ? 'הקלידו את הקוד שקיבלתם מהחופף הראשי, ו' : '') + G(u, 'בחר סיסמה ותזכור אותה.', 'בחרי סיסמה ותזכרי אותה.', 'בחר/י סיסמה ותזכור/י אותה.') : 'מה הסיסמה שלך?') + '</p></div></div>' +
        '<form data-form="login">' +
        (first && useCloud ? '<label class="field"><span>קוד כניסה ראשונה</span><input type="text" name="code" id="lg-code" required inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>' : '') +
        '<label class="field"><span>' + (first ? 'סיסמה חדשה' : 'סיסמה') + '</span><input type="password" name="pw" id="lg-pw" required ' + (first ? 'minlength="' + PW_MIN + '" autocomplete="new-password"' : 'autocomplete="current-password"') + '>' + (first ? '<small>לפחות ' + PW_MIN + ' תווים</small>' : '') + '</label>' +
        (first ? '<label class="field"><span>שוב את הסיסמה</span><input type="password" name="pw2" required minlength="' + PW_MIN + '" autocomplete="new-password"></label>' : '') +
        '<p class="err">' + esc(ui.loginErr) + '</p>' +
        '<div class="row"><button class="btn primary grow"' + (ui.busy ? ' disabled' : '') + '>' + (ui.busy ? 'רגע…' : first ? 'שמירה וכניסה' : 'כניסה') + '</button><button type="button" class="btn ghost" data-act="loginBack">זה לא אני</button></div></form>';
    } else {
      const people = loginPeople();
      inner = '<div class="auth-hero"><div class="hero-ico">' + duck(64) + '</div><h1>מי נכנס/ת?</h1><p>בוחרים את השם שלך מהרשימה</p></div>' +
        (people.length ? '<div class="who">' + people.map(x => '<button type="button" data-act="loginPick" data-id="' + x.id + '">' + avatar(x, 'sm') + '<span class="nm">' + esc(x.name) + '</span></button>').join('') + '</div>'
          : '<p class="muted" style="text-align:center">עוד אין משתמשים.</p>');
    }
    return '<div class="center"><div class="card auth">' + inner + '</div></div>';
  }

  /* ---------- Home (mentor / admin) ---------- */
  /* Group filter chips (only when groups exist); the chosen group sticks while moving between pages. */
  function groupChips(list) {
    const gs = groups();
    if (!gs.length) return '';
    if (ui.group !== 'all' && ui.group !== 'none' && !gs.some(g => g.id === ui.group)) ui.group = 'all';
    const opts = [['all', 'כולם', list.length]].concat(gs.map(g => [g.id, g.name, list.filter(t => t.groupId === g.id).length]).filter(x => x[2] || ui.group === x[0]));
    const none = list.filter(t => !groupName(t.groupId)).length;
    if (none) opts.push(['none', 'בלי קבוצה', none]);
    return '<div class="chips" role="group" aria-label="סינון לפי קבוצה" style="margin-bottom:16px">' + opts.map(([k, l, c]) =>
      '<button class="chip' + (ui.group === k ? ' on' : '') + '" data-act="pickGroup" data-g="' + k + '" aria-pressed="' + (ui.group === k) + '">' + esc(l) + ' · ' + c + '</button>').join('') + '</div>';
  }
  function homeView(m) {
    const all = visibleTrainees(m), list = all.filter(t => inGroup(t, ui.group));
    const head = '<div class="page-head"><div><h1>' + (m.role === 'admin' ? 'כל הנחפפים' : 'הנחפפים שלי') + ' 🌷</h1><p>' +
      (all.length ? all.length + ' נחפפים · לחצו על כרטיס כדי לראות ולערוך את העמוד' : '') + '</p></div>' +
      (m.role === 'admin' ? '<a class="btn primary" href="#/users">＋ משתמש חדש</a>' : '') + '</div>';
    const talks = all.length ? talksCard(m) : '';
    if (!all.length) {
      return head + '<div class="card empty"><span class="big">🐣</span><b>עוד אין כאן נחפפים</b>' +
        (m.role === 'admin' ? 'אפשר להוסיף נחפפים וחופפים אישיים בעמוד <a href="#/users">משתמשים</a>.' : 'החופף הראשי עוד לא שייך אליך נחפפים.') + '</div>';
    }
    let cards;
    if (ui.group === 'all' && groups().length) {
      /* With groups, "everyone" is shown as one section per group. */
      const secs = groups().map(g => [g.name, list.filter(t => t.groupId === g.id)]).concat([['בלי קבוצה', list.filter(t => !groupName(t.groupId))]]).filter(x => x[1].length);
      cards = secs.map(([name, ts]) => '<h2 class="grp-title">' + esc(name) + ' <span class="muted sm">' + ts.length + '</span></h2><div class="tgrid">' + ts.map(t => traineeCard(t, m)).join('') + '</div>').join('');
    } else cards = list.length ? '<div class="tgrid">' + list.map(t => traineeCard(t, m)).join('') + '</div>' : '<p class="muted">אין נחפפים בקבוצה הזו.</p>';
    return head + talks + groupChips(all) + cards;
  }
  function talksCard(m) {
    const list = upcomingTalks(k => k.mentorId === m.id && db.users[k.traineeId]);
    return '<section class="card" style="margin-bottom:20px"><div class="card-head"><h2>🗓️ השיחות האישיות שלי</h2><button class="btn soft sm" data-act="talkEdit" data-id="">＋ שיחה חדשה</button></div>' +
      (list.length ? '<ul class="marked">' + list.slice(0, 12).map(x => '<li><b class="num" style="min-width:110px">' + whenText(x.d) + (x.k.time ? ' · ' + esc(x.k.time) : '') + '</b>' +
        '<span class="grow">' + esc(userName(x.k.traineeId)) + (x.k.note ? ' <span class="muted">· ' + esc(x.k.note) + '</span>' : '') + '</span>' +
        '<span class="badge">' + REPEAT[x.k.repeat || 0] + '</span>' +
        '<button class="icon-btn" data-act="talkEdit" data-id="' + x.k.id + '" aria-label="עריכה">✏️</button><button class="icon-btn" data-act="talkDel" data-id="' + x.k.id + '" aria-label="מחיקה">🗑️</button></li>').join('') + '</ul>'
        : '<p class="hint" style="margin:0">עוד לא נקבעו שיחות. שיחה שנקבעה להיום או למחר תופיע כתזכורת בראש כל עמוד.</p>') + '</section>';
  }
  function traineeCard(t, m) {
    const sm = summary(t), pct = sm.total ? Math.round(sm.done / sm.total * 100) : 0, unread = unreadCount(t, m);
    const cur = sm.current, issues = openIssues(t.id).length;
    return '<a class="card tcard" href="#/t/' + t.id + '/sprints">' +
      '<div class="tc-head">' + avatar(t) + '<div><h3>' + esc(t.name) + '</h3>' +
      (m.role === 'admin' ? '<div class="muted sm">חופף אישי: ' + esc(userName(t.mentorId) || 'לא שויך') + '</div>' : '') + '</div>' +
      (issues ? '<span class="unread warn-b" title="דיווחים פתוחים">⚑ ' + issues + '</span>' : '') +
      (unread ? '<span class="unread" title="פתקים חדשים">💌 ' + unread + '</span>' : '') + '</div>' +
      '<div class="tc-stage"><span class="eyebrow">שלב נוכחי</span><b>' + esc(stageText(sm, t)) + '</b>' +
      (cur ? '<span class="t' + (cur.i.overdue ? ' bad' : '') + '">' + remainingText(cur.i, cur.s) + (cur.i.deadline && !cur.i.overdue ? ' · עד ' + fmtDate(cur.i.deadline) : '') + '</span>' : '') + '</div>' +
      '<div class="bar" role="img" aria-label="' + pct + '% מהחלקים הושלמו"><i style="width:' + pct + '%"></i></div>' +
      '<div class="tc-foot"><span>' + sm.done + '/' + sm.total + ' חלקים · ' + sm.qDone + '/' + sm.qs.length + ' שאלות</span>' + badge(tStatus(sm.status, t)) + '</div></a>';
  }

  /* ---------- Trainee page ---------- */
  function traineePage(t, m, tab) {
    let head = '';
    if (t.id !== m.id) {
      head = '<div class="t-head"><a class="back" href="#/home">→ חזרה לנחפפים</a><div class="t-id">' + avatar(t, 'lg') + '<div><h1>' + esc(t.name) + '</h1>' +
        '<div class="muted">חופף אישי: ' + esc(userName(t.mentorId) || 'לא שויך') + (groupName(t.groupId) ? ' · ' + esc(groupName(t.groupId)) : '') + '</div></div></div>' +
        '<nav class="tabs" aria-label="עמודי הנחפף">' + [['sprints', 'פורטנייטים ופתקים'], ['questions', 'צ׳קליסט'], ['issues', 'דיווחים' + (openIssues(t.id).length ? ' (' + openIssues(t.id).length + ')' : '')], ['calendar', 'לוח שנה']].map(([k, l]) =>
          '<a href="#/t/' + t.id + '/' + k + '" class="' + (tab === k ? 'on' : '') + '">' + l + '</a>').join('') + '</nav></div>';
    }
    if (tab === 'questions') return head + questionsTab(t, m);
    if (tab === 'calendar') return head + calendarTab(t, m);
    if (tab === 'issues') return head + issuesTab(t, m);
    return head + (t.id === m.id ? traineeHome(t, m) : sprintsTab(t, m));
  }

  function greeting() {
    const h = new Date().getHours();
    return h < 12 ? ['בוקר טוב', '☀️'] : h < 17 ? ['צהריים טובים', '🌤️'] : h < 21 ? ['ערב טוב', '🌙'] : ['לילה טוב', '✨'];
  }
  function encourage(sm, qd, qn, t) {
    if (sm.status === 'finished') return 'סיימת את כל החפיפה! איזה כיף 🎓';
    if (sm.status === 'empty') return 'התכנית שלך עוד בבנייה. ' + G(db.users[t.mentorId], 'החופף האישי שלך יוסיף', 'החופפת האישית שלך תוסיף', 'החופף האישי שלך יוסיף') + ' אותה בקרוב.';
    if (sm.status === 'idle') return G(t, 'מוכן', 'מוכנה', 'מוכנ/ה') + ' לפורטנייט הבא? 🚀';
    if (qn && qd === qn) return 'סימנת את כל השאלות! אפשר לסמן שסיימת 🎉';
    if (qn && qd / qn >= 0.5) return 'כבר עברת את חצי הדרך בחלק הזה 💪';
    return '';
  }
  const qStats = (t, s) => { const qs = questionsOf(t.id).filter(q => q.sprintId === s.id); return [qs.filter(q => q.status === 'done').length, qs.length]; };

  /* The trainee's own page: progress first, no countdowns or "late" marks. */
  function traineeHome(t, m) {
    /* Several fortnights can run side by side; each gets its own card. */
    const sm = summary(t), actives = sm.active.map(x => x.s), cur = actives[0] || null;
    const [qd, qn] = actives.reduce((a, s) => { const [d, n] = qStats(t, s); return [a[0] + d, a[1] + n]; }, [0, 0]);
    const [g, ge] = greeting();
    const enc = encourage(sm, qd, qn, t);
    const hello = '<div class="hello"><h1>' + g + ', ' + esc(t.name) + ' ' + ge + '</h1>' + (enc ? '<p>' + enc + '</p>' : '') + '</div>';
    const nowCard = s => {
      const i = sprintInfo(s), [d, n] = qStats(t, s), pct = n ? Math.round(d / n * 100) : 0;
      return '<section class="card now"><div class="eyebrow">עכשיו אני בפורטנייט</div><h2 class="now-title">' + esc(s.title) + '</h2>' + (s.desc ? '<p class="muted">' + esc(s.desc) + '</p>' : '') +
        /* No questions in this part: no count, ring or bar at all. */
        '<div class="now-body">' + (n ? progressRing(pct) : '') + '<div class="sp-facts">' +
        (n ? '<div class="big-line">' + d + ' מתוך ' + n + ' שאלות</div><div class="bar big" role="img" aria-label="' + pct + '% מהשאלות בוצעו"><i style="width:' + pct + '%"></i></div>' : '') +
        (!i.overdue && i.deadline ? '<div class="facts">מתוכנן עד ' + fmtDate(i.deadline) + '</div>' : '') +
        '<div class="row"><a class="btn soft" href="#/t/' + t.id + '/questions">לצ׳קליסט ✅</a><button class="btn primary" data-act="finishSprint" data-id="' + s.id + '">סיימתי! 🎉</button></div>' +
        '</div></div></section>';
    };
    let main;
    if (cur) {
      /* Only the first running fortnight here; parallel ones live in the checklist. The trainee may pick up the next one alongside. */
      main = nowCard(cur) + (sm.next ? '<div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="startSprint" data-id="' + sm.next.id + '">＋ להתחיל עוד פורטנייט במקביל</button></div>' : '');
    } else if (sm.next) {
      main = '<section class="card now"><div class="eyebrow">החלק הבא</div><h2 class="now-title">' + esc(sm.next.title) + '</h2>' + (sm.next.desc ? '<p class="muted">' + esc(sm.next.desc) + '</p>' : '') +
        '<div class="row" style="margin-top:14px"><button class="btn primary" data-act="startSprint" data-id="' + sm.next.id + '">▶ מתחילים</button></div></section>';
    } else {
      main = '<section class="card empty"><span class="big">' + (sm.sp.length ? '🎓' : '🗺️') + '</span><b>' + (sm.sp.length ? 'סיימת את כל החלקים!' : 'עוד אין חלקים') + '</b></section>';
    }
    /* Only the one task after the current one, so the trainee is not looking at the whole road ahead. */
    const upcoming = sm.sp.filter(s => s.status === 'todo' && (!sm.next || s.id !== sm.next.id || cur)).slice(0, 1);
    const next = upcoming.length ? '<div class="sec-head"><h2>מה הלאה</h2></div><ol class="journey">' + upcoming.map(s => '<li><span class="j-dot" aria-hidden="true"></span><div><b>' + esc(s.title) + '</b>' + (s.desc ? '<div class="muted sm">' + esc(s.desc) + '</div>' : '') + '</div></li>').join('') + '</ol>' : '';
    const doneList = sm.sp.filter(s => s.status === 'done');
    const done = doneList.length ? '<div class="sec-head"><h2>מה שכבר סיימת ✓</h2></div><ol class="journey done">' + doneList.map(s => {
      const [d, n] = qStats(t, s);
      return '<li><span class="j-dot" aria-hidden="true">✓</span><div><b>' + esc(s.title) + '</b><div class="muted sm">הסתיים ' + fmtDate(s.doneDate) + (n ? ' · ' + d + '/' + n + ' שאלות' : '') + '</div></div></li>';
    }).join('') + '</ol>' : '';
    return '<div class="layout"><section class="main-col">' + hello + main + next + done + '</section>' +
      '<aside class="side-col">' + weekCard(t, m) + notesCard(t, m) + '</aside></div>';
  }
  function progressRing(pct) {
    const R = 42, C = 2 * Math.PI * R;
    return '<div class="ring" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="' + R + '"/>' +
      '<circle class="val" cx="50" cy="50" r="' + R + '" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - pct / 100)).toFixed(2) + '"/></svg>' +
      '<div class="ring-in"><b>' + pct + '%</b><span>מהשאלות</span></div></div>';
  }
  /* What a mentor sees for one trainee: the deadline picture comes first. */
  function sprintsTab(t, m) {
    const sm = summary(t), mgr = canManage(m, t);
    /* One focus card per running fortnight, late ones first. */
    const running = sm.overdue.concat(sm.active.filter(x => !x.i.overdue));
    const focusCard = cur => {
      const [qd, qn] = qStats(t, cur.s), ext = extTotal(cur.s);
      const st = cur.i.overdue ? ['באיחור', 'bad'] : cur.i.noDeadline ? ['בעבודה', 'info'] : ['בזמן', 'ok'];
      return '<section class="card overview mgr-focus ' + (cur.i.overdue ? 'is-late' : '') + '"><div class="ov-top"><div><div class="eyebrow">' + (running.length > 1 ? 'פורטנייט פעיל' : 'הפורטנייט הנוכחי') + '</div><h2>' + esc(cur.s.title) + '</h2></div>' + badge(st) + '</div>' +
        '<div class="mf-grid"><div><div class="eyebrow">זמן</div><b class="' + (cur.i.overdue ? 'bad-t' : '') + '">' + remainingText(cur.i, cur.s) + '</b></div>' +
        '<div><div class="eyebrow">דדליין</div><b>' + (cur.i.noDeadline ? 'ללא' : cur.i.deadline ? fmtDate(cur.i.deadline) : '—') + '</b></div>' +
        (cur.i.noDeadline ? '' : '<div><div class="eyebrow">מוקצב</div><b>' + daysText(cur.i.total) + (ext ? ' <span class="muted sm">כולל ' + daysText(ext) + ' הארכה</span>' : '') + '</b></div>') +
        '<div><div class="eyebrow">צ׳קליסט</div><b>' + qd + '/' + qn + '</b></div></div></section>';
    };
    const focus = running.length ? '<div class="sprints">' + running.map(focusCard).join('') + '</div>'
      : '<section class="card overview"><div class="ov-top"><div><div class="eyebrow">הפורטנייט הנוכחי</div><h2>' + esc(stageText(sm, t)) + '</h2></div>' + badge(tStatus(sm.status, t)) + '</div></section>';
    const nextTalk = upcomingTalks(k => k.traineeId === t.id)[0], issues = openIssues(t.id).length;
    const meta = '<div class="ov-meta" style="margin:12px 4px 0"><span>חלקים שהושלמו: <b>' + sm.done + '/' + sm.total + '</b></span>' +
      (sm.lateDone ? '<span>הסתיימו באיחור: <b>' + sm.lateDone + '</b></span>' : '') +
      (sm.extDays ? '<span>סה״כ הארכות: <b>' + daysText(sm.extDays) + '</b></span>' : '') +
      '<span>דיווחים פתוחים: <b>' + (issues ? '<a href="#/t/' + t.id + '/issues">' + issues + '</a>' : '0') + '</b></span>' +
      '<span>שיחה אישית: <b>' + (nextTalk ? whenText(nextTalk.d) + (nextTalk.k.time ? ' ' + esc(nextTalk.k.time) : '') : 'לא נקבעה') + '</b></span></div>';
    /* The trainee-wide default lives on the user record, which only the main mentor can change. */
    const dlDefault = m.role === 'admin'
      ? '<button class="btn ghost sm" data-act="toggleNoDeadlines" data-tid="' + t.id + '" title="ברירת המחדל לכל הפורטנייטים של ' + esc(t.name) + '">⏱️ דדליינים כברירת מחדל: <b>' + (t.noDeadlines ? 'כבויים' : 'פעילים') + '</b></button>'
      : (t.noDeadlines ? '<span class="badge">⏱️ בלי דדליינים כברירת מחדל</span>' : '');
    const actions = '<div class="sec-head"><h2>הפורטנייטים</h2><div class="row">' + dlDefault +
      (mgr && planParts().length ? '<button class="btn ghost sm" data-act="applyPlan" data-tid="' + t.id + '">טעינה מתכנית החפיפה</button>' : '') +
      (mgr ? '<button class="btn primary" data-act="addSprint" data-tid="' + t.id + '">＋ פורטנייט חדש</button>' : '') + '</div></div>';
    /* What the trainee is on now, then what they finished, then what is still ahead. Arrows reorder within a section. */
    const num = s => sm.sp.indexOf(s) + 1;
    const section = (title, list) => list.length ? '<h3 class="sp-sec">' + title + '</h3>' + list.map((s, i) => sprintCard(s, t, m, num(s), i > 0, i < list.length - 1)).join('') : '';
    const list = sm.sp.length ? section('עכשיו', sm.sp.filter(s => s.status === 'active')) + section('הסתיימו', sm.sp.filter(s => s.status === 'done')) + section('הבאים בתור', sm.sp.filter(s => s.status === 'todo'))
      : '<div class="card empty"><span class="big">🗺️</span><b>אין עדיין פורטנייטים</b>' + (mgr ? 'לחצו על "פורטנייט חדש" או טענו את תכנית החפיפה.' : '') + '</div>';
    return '<div class="layout"><section class="main-col">' + focus + meta + actions + '<div class="sprints">' + list + '</div></section>' +
      '<aside class="side-col">' + weekCard(t, m) + notesCard(t, m) + '</aside></div>';
  }

  function ring(i) {
    const R = 42, C = 2 * Math.PI * R;
    const frac = i.overdue ? 1 : i.total ? Math.max(0, Math.min(1, i.remaining / i.total)) : 0;
    const cls = i.overdue ? 'bad' : i.remaining <= 1 ? 'warn' : '';
    const num = i.overdue ? '!' : fmtNum(i.remaining);
    const lbl = i.overdue ? 'באיחור' : i.remaining === 1 ? 'יום נותר' : 'ימים נותרו';
    return '<div class="ring ' + cls + '" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="' + R + '"/>' +
      '<circle class="val" cx="50" cy="50" r="' + R + '" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - frac)).toFixed(2) + '"/></svg>' +
      '<div class="ring-in"><b>' + num + '</b><span>' + lbl + '</span></div></div>';
  }

  function sprintCard(s, t, m, num, canUp, canDown) {
    /* Only mentors see these cards; trainees get traineeHome instead. */
    const i = sprintInfo(s), mgr = canManage(m, t), edit = mgr, own = false;
    const state = sprintState(s, i);
    const qs = questionsOf(t.id).filter(q => q.sprintId === s.id), qd = qs.filter(q => q.status === 'done').length;
    const ext = extTotal(s);
    let body;
    if (s.status === 'todo') {
      body = '<div class="sp-todo"><div class="sp-alloc">' + (i.noDeadline ? '<b>ללא דדליין</b>' : '<b>' + daysText(i.total) + '</b><span>מוקצבים לחלק הזה</span>') + '</div>' +
        (edit ? '<button class="btn primary" data-act="startSprint" data-id="' + s.id + '">▶ התחלת פורטנייט</button>' : '') + '</div>';
    } else if (s.status === 'active' && i.noDeadline) {
      const pct = qs.length ? Math.round(qd / qs.length * 100) : 0;
      body = '<div class="sp-active">' + progressRing(pct) + '<div class="sp-facts">' +
        '<div class="big-line">ללא דדליין</div>' +
        '<div class="facts">התחלה ' + fmtDate(s.startDate) + ' · ' + daysText(i.used) + ' עבודה עד עכשיו' + (qs.length ? ' · ' + qd + '/' + qs.length + ' שאלות' : '') + '</div>' +
        (edit ? '<div class="row"><button class="btn primary" data-act="finishSprint" data-id="' + s.id + '">סימון שהסתיים ✓</button></div>' : '') +
        '</div></div>';
    } else if (s.status === 'active') {
      body = '<div class="sp-active">' + ring(i) + '<div class="sp-facts">' +
        '<div class="big-line">' + remainingText(i, s) + '</div>' +
        (i.deadline ? '<div>' + (i.overdue ? 'הזמן נגמר ב' : 'צריך לסיים עד ') + '<b>' + fmtDate(i.deadline) + '</b></div>' : '<div class="muted">אין מספיק ימי עבודה לחישוב דדליין</div>') +
        '<div class="facts">התחלה ' + fmtDate(s.startDate) + ' · מוקצב ' + daysText(i.total) + (ext ? ' (כולל ' + daysText(ext) + ' הארכה)' : '') + '</div>' +
        (edit ? '<div class="row"><button class="btn primary" data-act="finishSprint" data-id="' + s.id + '">סימון שהסתיים ✓</button><button class="btn soft" data-act="extendSprint" data-id="' + s.id + '">＋ הארכה</button></div>' : '') +
        '</div></div>';
    } else {
      body = '<div class="sp-done"><span class="done-check" aria-hidden="true">✓</span><div><div class="big-line">הסתיים ' + fmtDate(s.doneDate) + '</div>' +
        '<div class="facts">לקח ' + daysText(i.used) + (i.noDeadline ? '' : ' מתוך ' + daysText(i.total)) + ' · התחלה ' + fmtDate(s.startDate) + '</div></div>' +
        (i.noDeadline ? badge(['ללא דדליין', '']) : badge(i.late ? ['באיחור של ' + daysText(i.over), 'bad'] : ['בזמן 💪', 'ok'])) + '</div>';
    }
    const exts = (s.extensions || []).length ? '<details class="exts"><summary>' + s.extensions.length + ' ' + (s.extensions.length === 1 ? 'הארכה' : 'הארכות') + ' · סה״כ ' + daysText(ext) + '</summary><ul>' +
      s.extensions.map(e => '<li><b>＋' + daysText(+e.days) + '</b> ' + esc(e.reason) + ' <span class="muted">· ' + esc(userName(e.by) || '?') + ', ' + fmtShort(e.at) + '</span></li>').join('') + '</ul></details>' : '';
    let tools = '';
    if (mgr) tools += '<button class="icon-btn" data-act="moveSprint" data-dir="-1" data-id="' + s.id + '" title="העברה למעלה" aria-label="העברה למעלה" ' + (canUp ? '' : 'disabled') + '>▲</button>' +
      '<button class="icon-btn" data-act="moveSprint" data-dir="1" data-id="' + s.id + '" title="העברה למטה" aria-label="העברה למטה" ' + (canDown ? '' : 'disabled') + '>▼</button>';
    if (mgr && s.status === 'done') tools += '<button class="icon-btn" data-act="reopenSprint" data-id="' + s.id + '" title="פתיחה מחדש" aria-label="פתיחה מחדש">↺</button>';
    if (mgr || own) tools += '<button class="icon-btn" data-act="editSprint" data-id="' + s.id + '" title="עריכה" aria-label="עריכה">✏️</button>';
    if (mgr || (own && s.status === 'todo')) tools += '<button class="icon-btn" data-act="delSprint" data-id="' + s.id + '" title="מחיקה" aria-label="מחיקה">🗑️</button>';
    const plan = s.planId && !s.qCopied ? planParts().find(p => p.id === s.planId) : null;
    const pending = plan ? (plan.questions || []).length : 0;
    const qLink = s.status === 'active' ? '<a class="link" href="#/t/' + t.id + '/questions">✅ ' + qd + '/' + qs.length + ' בצ׳קליסט</a>'
      : s.status === 'done' && qs.length ? '<span class="muted sm">✅ ' + qd + '/' + qs.length + ' שאלות</span>'
      : pending + qs.length ? '<span class="muted sm">📝 ' + (pending + qs.length) + ' שאלות יופיעו בצ׳קליסט כשמתחילים</span>' : '';
    const foot = qLink + exts + (tools ? '<div class="tools">' + tools + '</div>' : '');
    return '<article class="sprint st-' + state + '"><div class="sp-head"><span class="sp-num">' + num + '</span>' +
      '<div class="sp-title"><h3>' + esc(s.title) + '</h3>' + (s.desc ? '<p>' + esc(s.desc) + '</p>' : '') + '</div>' + badge(SP_STATUS[state]) + '</div>' +
      '<div class="sp-body">' + body + '</div>' + (foot ? '<div class="sp-foot">' + foot + '</div>' : '') + '</article>';
  }

  function weekCard(t, m) {
    /* The trainee does not see how days are counted (full / half day); mentors do. */
    const edit = canEdit(m, t), today = todayISO(), counts = m.id !== t.id;
    let days = '';
    for (let k = 0; k < 7; k++) {
      const d = addDays(today, k), wd = parse(d).getDay(), weekend = wd >= 5, hol = absEntry('_global', d), abs = absEntry(t.id, d);
      const fullHol = hol && !hol.half;
      const st = weekend ? 'weekend' : fullHol ? 'holiday' : abs ? (abs.half ? 'half' : 'away') : hol ? 'holiday' : 'in';
      const lbl = weekend ? 'סופ״ש' : fullHol ? esc(hol.note || 'חג / יום חופש') : abs ? esc(absLabel(abs)) : hol ? esc((hol.note || 'חג') + ' · חצי יום') : 'במאמן';
      const v = dayValue(d, t.id), val = v && counts ? (v === 1 ? '1' : '½') : '';
      days += '<button class="day ' + st + (k === 0 ? ' today' : '') + '" ' + (!edit || weekend || fullHol ? 'disabled' : '') +
        ' data-act="toggleAbs" data-tid="' + t.id + '" data-date="' + d + '" aria-pressed="' + !!abs + '">' +
        '<span class="d-name">' + (k === 0 ? 'היום' : DAY_SHORT[wd] + '׳') + '</span><span class="d-num">' + dm(d) + '</span>' +
        '<span class="d-st">' + lbl + '</span>' + (val ? '<span class="d-val">' + val + '</span>' : '') + '</button>';
    }
    return '<section class="card week"><div class="card-head"><h2>🗓️ השבוע הקרוב</h2><a class="link" href="#/t/' + t.id + '/calendar">ללוח השנה</a></div>' +
      '<p class="hint">' + (edit ? 'לחיצה על יום: לא במאמן כל היום. לחיצה נוספת: רק חצי יום. לחיצה שלישית: ביטול. הפורטנייט יתעדכן לבד.' : 'הימים שבהם ' + esc(t.name) + ' לא ' + G(t, 'נמצא', 'נמצאת', 'נמצא/ת') + ' במאמן.') + '</p>' +
      '<div class="days">' + days + '</div>' + (counts ? '<p class="legend"><span>א׳–ד׳ = יום שלם</span><span>ה׳ = חצי יום</span><span>ו׳–ש׳ לא נספרים</span></p>' : '') + '</section>';
  }

  function notesCard(t, m) {
    const msgs = messagesOf(t.id).slice(0, 40), prev = ui.seenPrev[seenKey(m, t.id)] || 0;
    const up = m.id === t.id, mentor = db.users[t.mentorId];
    const target = up ? (mentor ? mentor.name : G(mentor, 'החופף', 'החופפת', 'החופף')) : t.name;
    const colors = ['c1', 'c2', 'c3', 'c4'];
    const sentToday = msgs.some(x => x.fromId === m.id && iso(new Date(x.at)) === todayISO());
    const form = canEdit(m, t) ? '<form class="note-form" data-form="note" data-tid="' + t.id + '">' +
      '<label class="sr" for="note-' + t.id + '" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">המסר היומי</label>' +
      '<textarea id="note-' + t.id + '" name="text" data-keep maxlength="240" rows="2" placeholder="מה המסר של היום ל' + esc(target) + '?"></textarea>' +
      '<div class="note-tools">' + colors.map((c, i) => '<label class="swatch" title="צבע"><input type="radio" name="color" value="' + c + '" data-change="noteColor"' + (ui.noteColor === c ? ' checked' : '') + ' aria-label="צבע ' + (i + 1) + '"><span class="sw' + (i + 1) + '"></span></label>').join('') +
      '<span class="grow"></span>' + ['💛', '🌸', '⭐', '☕', '🎉', '🍀'].map(e => '<button type="button" class="emo" data-act="emoji" data-tid="' + t.id + '" data-e="' + e + '" aria-label="הוספת ' + e + '">' + e + '</button>').join('') +
      '<button class="btn primary sm">שליחה 💌</button></div></form>' : '';
    const list = msgs.length ? '<ul class="notes">' + msgs.map(x => '<li class="note ' + esc(x.color || 'c1') + (x.at > prev && x.fromId !== m.id ? ' new' : '') + '">' +
      '<p>' + esc(x.text) + '</p><div class="by">— ' + esc(userName(x.fromId) || 'מישהו') + ' · ' + ago(x.at) + '</div>' +
      (x.fromId === m.id || m.role === 'admin' ? '<button class="icon-btn x" data-act="delNote" data-id="' + x.id + '" aria-label="מחיקת המסר">✕</button>' : '') + '</li>').join('') + '</ul>'
      : '<p class="hint" style="margin:12px 0 0">עוד אין מסרים. מי ישבור את הקרח? 🧊</p>';
    return '<section class="card"><div class="card-head"><h2>📮 המסר היומי ל' + esc(target) + '</h2>' + (sentToday ? '<span class="badge ok">נשלח היום ✓</span>' : '') + '</div>' + form + list + '</section>';
  }

  /* ---------- Questions ---------- */
  function questionsTab(t, m) {
    const edit = canEdit(m, t), mgr = canManage(m, t), self = m.id === t.id, allQs = questionsOf(t.id), sp = sprintsOf(t.id);
    const gid = q => (q.sprintId && db.sprints[q.sprintId]) ? q.sprintId : '';
    /* The checklist shows only the parts that are running now; a part's questions leave it once the part is marked done. */
    const active = sp.filter(s => s.status === 'active');
    const qs = allQs.filter(q => active.some(s => s.id === gid(q)));
    const f = ui.qFilter, count = s => qs.filter(q => q.status === s).length;
    const done = count('done'), pct = qs.length ? Math.round(done / qs.length * 100) : 0;
    const filters = [['all', 'הכל', qs.length], ['todo', 'עוד לא התחלתי', count('todo')], ['doing', 'בעבודה', count('doing')], ['done', 'בוצע', done]];
    const head = '<section class="card"><div class="q-top"><div><h1 style="font-size:1.4rem">✅ ' + (self ? 'הצ׳קליסט שלי' : 'הצ׳קליסט של ' + esc(t.name)) + '</h1>' +
      (active.length && !qs.length ? '' : '<p class="muted">' + (active.length ? done + ' מתוך ' + qs.length + ' בוצעו · השאלות של ' + (active.length === 1 ? 'החלק שהתחלת' : 'החלקים שהתחלת') : 'כאן יופיעו השאלות של החלק שמתחילים') + '</p>') + '</div>' +
      (qs.length ? '<div class="chips" role="group" aria-label="סינון">' + filters.map(([k, l, c]) => '<button class="chip' + (f === k ? ' on' : '') + '" data-act="qFilter" data-f="' + k + '" aria-pressed="' + (f === k) + '">' + l + ' · ' + c + '</button>').join('') + '</div>' : '') + '</div>' +
      (qs.length ? '<div class="bar big" style="margin-top:14px"><i style="width:' + pct + '%"></i></div>' : '') + '</section>';
    const next = sp.find(s => s.status === 'todo');
    const empty = active.length ? '' : '<section class="card empty"><span class="big">' + (next ? '🚀' : sp.length ? '🎓' : '🗺️') + '</span><b>' +
      (next ? 'אין כרגע חלק פעיל' : sp.length ? 'כל החלקים הושלמו!' : 'אין עדיין חלקים') + '</b>' +
      (next ? 'כש' + (self ? G(t, 'תתחיל', 'תתחילי', 'תתחיל/י') : 'יתחילו') + ' את "' + esc(next.title) + '" בעמוד <a href="#/t/' + t.id + '/sprints">הפורטנייטים</a>, השאלות שלו יופיעו כאן.' : '') + '</section>';
    const group = g => {
      const all = allQs.filter(q => gid(q) === g.id);
      const shown = g.s && g.s.status === 'active' && f !== 'all' ? all.filter(q => q.status === f) : all;
      const gd = all.filter(q => q.status === 'done').length;
      const state = g.s ? sprintState(g.s, sprintInfo(g.s)) : null;
      /* The trainee never sees "late"; each running fortnight can be finished right from its checklist. */
      const shownState = self && state === 'overdue' ? 'active' : state;
      return '<section class="card q-group"><div class="q-group-head"><h2>' + esc(g.title) + '</h2>' + (shownState ? badge(SP_STATUS[shownState]) : '') +
        (all.length ? '<span class="muted sm">' + gd + '/' + all.length + '</span><div class="bar"><i style="width:' + Math.round(gd / all.length * 100) + '%"></i></div>' : '') +
        (self && g.s && g.s.status === 'active' ? '<button class="btn primary sm" style="margin-inline-start:auto" data-act="finishSprint" data-id="' + g.s.id + '">סיימתי! 🎉</button>' : '') + '</div>' +
        (shown.length ? '<ul class="qs">' + shown.map(q => qRow(q, m, edit, mgr)).join('') + '</ul>' : (all.length ? '<p class="hint" style="margin:0">אין כאן שאלות בסינון הזה</p>' : mgr ? '<p class="hint" style="margin:0">עוד אין שאלות בחלק הזה</p>' : '')) +
        (edit ? '<form class="q-add" data-form="qAdd" data-tid="' + t.id + '" data-gid="' + g.id + '"><input type="text" id="qadd-' + t.id + '-' + (g.id || 'gen') + '" name="text" data-keep maxlength="300" placeholder="שאלה חדשה…" aria-label="שאלה חדשה ב' + esc(g.title) + '"><button class="btn soft">הוספה</button>' +
          (mgr ? '<button type="button" class="btn ghost" data-act="qBulk" data-tid="' + t.id + '" data-gid="' + g.id + '" title="הוספת כמה שאלות בבת אחת">כמה בבת אחת</button>' : '') + '</form>' : '') +
        '</section>';
    };

  function qRow(q, m, edit, mgr) {

  /* ---------- Issue reports ---------- */
  function issueSubject(x) {

  /* ---------- Calendar ---------- */
  function calendarGrid(key, tid, editable, deadlines) {
    /* A trainee's own calendar (deadlines off) hides how many work days each day counts for. */
    const counts = !tid || deadlines;
    const today = todayISO(), month = ui.cal[key] || today.slice(0, 7);
    const [y, mo] = month.split('-').map(Number);
    const first = new Date(y, mo - 1, 1), daysIn = new Date(y, mo, 0).getDate();
    const ev = {};
    if (tid) sprintsOf(tid).forEach(s => {
      if (!s.startDate) return;
      const add = (d, c, txt) => { if (d) (ev[d] = ev[d] || []).push({ c, txt }); };
      add(s.startDate, 'start', '▶ ' + s.title);
      if (s.status === 'done') add(s.doneDate, 'done', '✓ ' + s.title);
      else if (deadlines) { const i = sprintInfo(s); add(i.deadline, i.overdue ? 'late' : 'due', '🏁 ' + s.title); }
    });
    let cells = DAY_SHORT.map(d => '<div class="cal-dow">' + d + '׳</div>').join('');
    for (let k = 0; k < first.getDay(); k++) cells += '<div class="cell blank"></div>';
    let work = 0;
    for (let n = 1; n <= daysIn; n++) {
      const d = month + '-' + pad(n), wd = parse(d).getDay(), weekend = wd >= 5, hol = absEntry('_global', d), abs = tid ? absEntry(tid, d) : null;
      const isHol = !!hol, isAbs = !!abs, fullHol = hol && !hol.half;
      const v = dayValue(d, tid); work += v;
      const cls = ['cell', weekend ? 'weekend' : '', isHol ? 'holiday' : '', isAbs ? (abs.half ? 'half' : 'away') : '', !tid && hol && hol.half ? 'half' : '', d === today ? 'today' : ''].join(' ');
      const clickable = editable && !weekend && (tid ? !fullHol : true);
      const lbl = isAbs ? absLabel(abs) : isHol ? (hol.note || 'חג') + (hol.half ? ' · חצי יום' : '') : '';
      const inner = '<span class="c-top"><span class="c-n">' + n + '</span>' + (v && counts ? '<span class="c-v">' + (v === 1 ? 'יום' : '½') + '</span>' : '') + '</span>' +
        (lbl ? '<span class="c-lbl">' + esc(lbl) + '</span>' : '') + (ev[d] || []).map(e => '<span class="ev ' + e.c + '" title="' + esc(e.txt) + '">' + esc(e.txt) + '</span>').join('');
      const aria = fmtDate(d) + (lbl ? ', ' + lbl : '');
      cells += clickable
        ? '<button class="' + cls + '" data-act="toggleAbs" data-tid="' + key + '" data-date="' + d + '" aria-label="' + esc(aria) + '" aria-pressed="' + (isAbs || (!tid && isHol)) + '">' + inner + '</button>'
        : '<div class="' + cls + '" aria-label="' + esc(aria) + '">' + inner + '</div>';
    }
    return '<section class="card"><div class="cal-head"><h2>' + MONTHS[mo - 1] + ' ' + y + '</h2>' +
      '<button class="btn ghost sm" data-act="calMove" data-key="' + key + '" data-d="0">היום</button>' +
      '<button class="icon-btn" data-act="calMove" data-key="' + key + '" data-d="-1" aria-label="החודש הקודם">→</button>' +
      '<button class="icon-btn" data-act="calMove" data-key="' + key + '" data-d="1" aria-label="החודש הבא">←</button></div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<p class="legend"><span><i style="background:var(--bad-soft)"></i>לא במאמן</span><span><i style="background:var(--warn-soft)"></i>חצי יום</span><span><i style="background:var(--info-soft)"></i>חג / חופש כללי</span>' +
      (tid ? '<span><i style="background:var(--accent-soft)"></i>▶ התחלת פורטנייט</span>' + (deadlines ? '<span>🏁 דדליין</span>' : '') + '<span><i style="background:var(--ok-soft)"></i>✓ הסתיים</span>' : '') +
      (counts ? '<span>· ' + fmtNum(work) + ' ימי עבודה בחודש</span>' : '') + '</p></section>';
  }
  function markedList(key, canDel, emptyText) {
    const today = todayISO(), map = absMap(key);

    if (!list.length) return '<p class="hint" style="margin:0">' + emptyText + '</p>';
    return '<ul class="marked">' + list.slice(0, 30).map(d => { const e = absEntry(key, d); return '<li><b class="num">' + fmtDate(d) + '</b><span class="grow muted">' + (e.half ? 'חצי יום' + (e.note ? ' · ' : '') : '') + esc(e.note) + '</span>' +

  /* ---------- Attendance: who is in the office each day, per group ---------- */

    const sun = ui.attWeek || thisSun, days = [0, 1, 2, 3, 4].map(k => addDays(sun, k));

      if (a && !a.half) return '<td class="att away" title="' + esc(a.note || 'לא במאמן') + '">✕ ' + (a.note ? '<span class="att-n">' + esc(a.note) + '</span>' : '') + '</td>';

    const present = (ts, d) => ts.filter(t => dayValue(d, t.id) === baseValue(d) && baseValue(d)).length;

      ts.map(t => '<tr><td><a class="tn" href="#/t/' + t.id + '/calendar">' + avatar(t, 'sm') + esc(t.name) + '</a></td>' + days.map(d => cell(t, d)).join('') + '</tr>').join('') + '</tbody></table></div></section>';

  /* ================= Dialogs ================= */
  const dlg = $('dlg');
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  function openDialog(o) {
    dlg.innerHTML = '<form class="dlg-form" novalidate><h2 id="dlgTitle">' + o.title + '</h2>' + (o.body || '') +
      '<p class="err" id="dlgErr"></p><div class="dlg-actions"><button class="btn ' + (o.danger ? 'danger' : 'primary') + '">' + (o.ok || 'שמירה') + '</button>' +
      '<button type="button" class="btn ghost" data-close>ביטול</button></div></form>';
    const f = dlg.querySelector('form');
    f.querySelector('[data-close]').onclick = () => dlg.close();
    f.onsubmit = e => {
      e.preventDefault();
      const res = o.onOk(f);
      if (typeof res === 'string') { $('dlgErr').textContent = res; return; }
      dlg.close();
    };
    dlg.showModal();
    if (o.onOpen) o.onOpen(f);
    const first = f.querySelector('input:not([type=hidden]), textarea, select');
    if (first) first.focus();
  }
  function confirmDlg(title, text, ok, fn) { openDialog({ title, body: '<p>' + text + '</p>', ok, danger: true, onOk: () => { fn(); } }); }
  const fv = (f, n) => { const el = f.elements.namedItem(n); return el ? String(el.value).trim() : ''; };
  const dateField = (name, label, val, extra) => '<label class="field"><span>' + label + '</span><input type="date" name="' + name + '" value="' + (val || '') + '" ' + (extra || '') + '></label>';
  const daysField = (name, label, val, hint) => '<label class="field"><span>' + label + '</span><input type="number" name="' + name + '" min="0.5" step="0.5" value="' + (val == null ? '' : val) + '" inputmode="decimal">' + (hint ? '<small>' + hint + '</small>' : '') + '</label>';
  function readDays(f, name) { const v = parseFloat(fv(f, name).replace(',', '.')); return isFinite(v) && v > 0 ? half(v) : null; }

  function sprintDialog(s, tid) {
    const m = me(), t = db.users[tid], mgr = canManage(m, t);
    const isNew = !s;
    const daysEditable = isNew || mgr || s.status === 'todo';
    let body = '<label class="field"><span>שם החלק</span><input type="text" name="title" maxlength="80" value="' + esc(s ? s.title : '') + '"></label>' +
      (daysEditable ? daysField('days', 'ימים מוקצבים', s ? s.days : 1, 'א׳–ד׳ נחשבים יום, ה׳ חצי יום. ' + (s && extTotal(s) ? 'ההארכות (' + daysText(extTotal(s)) + ') נוספות על זה.' : '')) : '') +
      '<label class="field"><span>תיאור (לא חובה)</span><textarea name="desc" maxlength="500">' + esc(s ? s.desc || '' : '') + '</textarea></label>';
    if (mgr) {
      const mode = (s && s.deadlineMode) || '';
      body += '<label class="field"><span>דדליין</span><select name="dl">' +
        [['', 'לפי ברירת המחדל של ' + esc(t.name) + ' (' + (t.noDeadlines ? 'בלי' : 'עם') + ' דדליין)'], ['on', 'עם דדליין'], ['off', 'בלי דדליין']]
          .map(([k, l]) => '<option value="' + k + '"' + (mode === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>' +
        '<small>בלי דדליין: אין ספירה לאחור ואין "באיחור", רק כמה ימים זה לוקח.</small></label>';
    }
    if (!isNew && mgr) {
      body += '<label class="field"><span>מצב</span><select name="status">' + [['todo', 'טרם התחיל'], ['active', 'בעבודה'], ['done', 'הושלם']].map(([k, l]) => '<option value="' + k + '"' + (s.status === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></label>' +
        '<div class="grid2">' + dateField('start', 'תאריך התחלה', s.startDate) + dateField('done', 'תאריך סיום', s.doneDate) + '</div>';
    }
    openDialog({
      title: isNew ? 'פורטנייט חדש ✨' : 'עריכת פורטנייט', ok: isNew ? 'הוספה' : 'שמירה', body,
      onOk: f => {
        const title = fv(f, 'title');
        if (!title) return 'צריך לתת שם לחלק';
        let days = s ? s.days : 1;
        if (daysEditable) { days = readDays(f, 'days'); if (days == null) return 'מספר הימים צריך להיות לפחות חצי יום'; }
        if (isNew) {
          const order = sprintsOf(tid).reduce((a, x) => Math.max(a, x.order || 0), 0) + 1;
          put('sprints', { id: uid(), traineeId: tid, title, desc: fv(f, 'desc'), days, status: 'todo', extensions: [], order, createdBy: m.id, createdAt: Date.now(), deadlineMode: mgr ? fv(f, 'dl') || null : null });
          toast('הפורטנייט נוסף', true);
          return;
        }
        const n = Object.assign({}, s, { title, desc: fv(f, 'desc'), days });
        if (mgr) {
          n.deadlineMode = fv(f, 'dl') || null;
          n.status = fv(f, 'status');
          n.startDate = fv(f, 'start') || null; n.doneDate = fv(f, 'done') || null;
          if (n.status !== 'todo' && !n.startDate) n.startDate = todayISO();
          if (n.status === 'done' && !n.doneDate) n.doneDate = todayISO();
          if (n.status !== 'done') n.doneDate = null;
          if (n.status === 'todo') n.startDate = null;
          if (n.status !== 'todo' && s.status === 'todo') { copyPlanQuestions(n); n.qCopied = true; }
          if (n.doneDate && n.startDate && n.doneDate < n.startDate) return 'תאריך הסיום לפני תאריך ההתחלה';
        }
        put('sprints', n); toast('נשמר');
      }
    });

  /* ================= Actions ================= */
  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const fx = $('fx'), em = ['🎉', '✨', '🌟', '💜', '🎊', 'duck', '💛'];
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('span');
      if (em[i % em.length] === 'duck') s.innerHTML = duck(30); else s.textContent = em[i % em.length];
      s.style.left = (Math.random() * 100) + 'vw';
      s.style.animationDelay = (Math.random() * .5) + 's';
      s.style.setProperty('--x', (Math.random() * 160 - 80) + 'px');
      s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      fx.appendChild(s); setTimeout(() => s.remove(), 2800);
    }
  }

  /* partIds: only these plan parts (all of them when omitted). Parts the trainee already has (same name) are skipped. */
  function applyPlan(tid, partIds) {
    const m = me(), sp = sprintsOf(tid), have = new Set(sp.map(s => s.title.trim()));
    let order = sp.reduce((a, s) => Math.max(a, s.order || 0), 0), added = 0;
    const now = Date.now();
    planParts().forEach(p => {
      if (partIds && partIds.indexOf(p.id) < 0) return;
      if (have.has(p.title.trim())) return;
      const sid = uid();
      put('sprints', { id: sid, traineeId: tid, title: p.title, desc: p.desc || '', days: +p.days || 1, status: 'todo', extensions: [], order: ++order, createdBy: m.id, createdAt: now + added, fromPlan: true, planId: p.id });
      added++;
    });
    return added;
  }
  /* Pick which plan parts go to whom: one trainee, a whole group, or everyone. o.tid fixes the trainee; o.partId preselects one part. */

    const fixed = o.tid && db.users[o.tid];
    const has = t => new Set(sprintsOf(t.id).map(s => s.title.trim()));
    const target = fixed ? '<p class="muted" style="margin-bottom:12px">ל' + esc(fixed.name) + '</p>'
      : '<label class="field"><span>למי?</span><select name="to">' +
        (groups().length ? '<optgroup label="קבוצות">' + groups().map(g => '<option value="g:' + g.id + '">' + esc(g.name) + ' (' + ts.filter(t => t.groupId === g.id).length + ')</option>').join('') + '</optgroup>' : '') +
        '<optgroup label="נחפף אחד">' + ts.map(t => '<option value="t:' + t.id + '">' + esc(t.name) + '</option>').join('') + '</optgroup>' +
        '<option value="all">כל הנחפפים (' + ts.length + ')</option></select>' +
        '<small>קבוצה מקבלת את החלקים לכל מי שנמצא בה עכשיו.</small></label>';
    const mine = fixed ? has(fixed) : null;
    const boxes = '<div class="field"><span>אילו חלקים?</span><div class="pick-list">' + parts.map((p, i) => {
      const already = mine && mine.has(p.title.trim());
      const on = already ? false : o.partId ? p.id === o.partId : true;
      return '<label class="check"><input type="checkbox" name="part" value="' + p.id + '"' + (on ? ' checked' : '') + (already ? ' disabled' : '') + '><span>' + (i + 1) + '. ' + esc(p.title) +
        ' <span class="muted sm">' + daysText(+p.days) + (already ? ' · כבר קיים' : '') + '</span></span></label>';
    }).join('') + '</div><small>חלק שכבר קיים אצל נחפף (באותו שם) לא יתווסף שוב.</small></div>';
    openDialog({
      title: '🧭 התאמת התכנית', ok: 'הוספה', body: target + boxes,
      onOk: f => {
        const ids = [...f.querySelectorAll('input[name=part]:checked')].map(x => x.value);
        if (!ids.length) return 'צריך לבחור לפחות חלק אחד';
        let list;
        if (fixed) list = [fixed];
        else {
          const to = fv(f, 'to');
          list = to === 'all' ? ts : to.startsWith('g:') ? ts.filter(t => t.groupId === to.slice(2)) : ts.filter(t => t.id === to.slice(2));
        }
        if (!list.length) return 'אין נחפפים בקבוצה הזו';
        let added = 0, who = 0;
        list.forEach(t => { const n = applyPlan(t.id, ids); added += n; if (n) who++; });
        toast(added ? 'נוספו ' + added + ' חלקים' + (list.length > 1 ? ' ל-' + who + ' נחפפים' : '') : 'החלקים האלה כבר קיימים אצל ' + (list.length > 1 ? 'כולם' : esc(list[0].name)));
      }
    });
  }
  /* A plan part's questions are copied when the part starts, so the trainee gets the plan as it is at that moment. */
  function copyPlanQuestions(s) {
    if (!s.planId || s.qCopied) return 0;
    const p = planParts().find(x => x.id === s.planId);
    const have = new Set(questionsOf(s.traineeId).filter(q => q.sprintId === s.id).map(q => q.text.trim()));
    const now = Date.now(), list = ((p && p.questions) || []).filter(q => !have.has(q.trim()));
    list.forEach((text, qi) => put('questions', { id: uid(), traineeId: s.traineeId, sprintId: s.id, text, status: 'todo', note: '', createdBy: me().id, createdAt: now + qi, order: qi, fromPlan: true }));
    return list.length;
  }

  /* about: '' for the whole onboarding, 's:<sprint id>' or 'q:<question id>'; titles are kept so the report still reads well if the item is deleted. */
  function addIssue(tid, about, text) {
    const x = { id: uid(), traineeId: tid, fromId: me().id, text, status: 'open', at: Date.now() };
    if (about.startsWith('q:')) { const q = db.questions[about.slice(2)]; if (q) { x.questionId = q.id; x.questionText = q.text; x.sprintId = q.sprintId || null; } }
    else if (about.startsWith('s:')) { const s = db.sprints[about.slice(2)]; if (s) { x.sprintId = s.id; x.sprintTitle = s.title; } }
    put('issues', x);
    const t = db.users[tid], mentor = t && db.users[t.mentorId];
    toast('הדיווח נשלח. ' + G(mentor, 'החופף האישי שלך יראה', 'החופפת האישית שלך תראה', 'החופף האישי שלך יראה') + ' אותו ⚑');
  }
  function beginSprint(s, d) {
    const nq = copyPlanQuestions(s);
    put('sprints', Object.assign({}, s, { status: 'active', startDate: d, doneDate: null, qCopied: true }));
    return nq;
  }
  /* Absence cycle on a work day: in the office → away all day → away half a day → in the office. Thursday is already half, so it skips the half step. */
  function cycleAbsence(key, d, note) {
    const cur = db.absences[key], doc = { id: key, days: Object.assign({}, cur && cur.days) }, e = absEntry(key, d);
    if (!e) doc.days[d] = { half: false, note };
    else if (!e.half && baseValue(d) === 1) doc.days[d] = { half: true, note: e.note };
    else delete doc.days[d];
    put('absences', doc);
  }

  function deleteUserCascade(u) {
    Object.values(db.issues).filter(x => x.traineeId === u.id).forEach(x => del('issues', x.id));
    Object.values(db.talks).filter(x => x.traineeId === u.id || x.mentorId === u.id).forEach(x => del('talks', x.id));
    Object.values(db.sprints).filter(x => x.traineeId === u.id).forEach(x => del('sprints', x.id));
    Object.values(db.questions).filter(x => x.traineeId === u.id).forEach(x => del('questions', x.id));
    Object.values(db.messages).filter(x => x.traineeId === u.id).forEach(x => del('messages', x.id));
    if (db.absences[u.id]) del('absences', u.id);
    Object.values(db.users).filter(x => x.mentorId === u.id).forEach(x => put('users', Object.assign({}, x, { mentorId: null })));
    del('users', u.id);
    if (photoOf(u.id)) setPhoto(u.id, null);
    if (useCloud) { pubDel('names', u.id); pubDel('claims', u.id); pubDel('invites', u.id); }
  }

          f.querySelector('#phFile').addEventListener('change', e => {

      openDialog({

        onOpen: f => previewDeadline(f, f => { const d = readDays(f, 'days'); return d && s.startDate ? Object.assign({}, s, { extensions: (s.extensions || []).concat([{ days: d }]) }) : null; }),
        onOk: f => {
          const d = readDays(f, 'days'); if (d == null) return 'צריך לפחות חצי יום';
          const reason = fv(f, 'reason'); if (!reason) return 'כתבו במילים למה צריך את ההארכה';
          put('sprints', Object.assign({}, s, { extensions: (s.extensions || []).concat([{ days: d, reason, by: me().id, at: Date.now() }]) }));

    finishSprint(el) {
      const s = db.sprints[el.dataset.id]; if (!s) return;
      openDialog({
        title: '🎉 סיימת את "' + esc(s.title) + '"?', ok: 'כן, סיימתי!',
        body: dateField('done', 'תאריך סיום', todayISO(), 'min="' + s.startDate + '"'),
        onOk: f => {
          const d = fv(f, 'done'); if (!d) return 'צריך לבחור תאריך';
          if (d < s.startDate) return 'תאריך הסיום לפני ההתחלה';
          put('sprints', Object.assign({}, s, { status: 'done', doneDate: d }));
          /* Finishing a part hands over the next one straight away, unless another part is still running. */
          const list = sprintsOf(s.traineeId);
          const next = list.some(x => x.status === 'active' && x.id !== s.id) ? null : list.find(x => x.status === 'todo');
          if (next) beginSprint(next, d);
          confetti(); toast('כל הכבוד! 🎉' + (next ? ' הפורטנייט הבא התחיל: ' + next.title : ''));

    reopenSprint(el) {

    delSprint(el) {
      const s = db.sprints[el.dataset.id]; if (!s) return;
      const qs = Object.values(db.questions).filter(q => q.sprintId === s.id);
      confirmDlg('מחיקת פורטנייט', 'למחוק את "' + esc(s.title) + '"' + (qs.length ? ' ואת ' + qs.length + ' השאלות שבו' : '') + '? אי אפשר לבטל.', 'מחיקה', () => {

    moveSprint(el) {
      const s = db.sprints[el.dataset.id]; if (!s) return;
      /* Swap with the nearest part in the same section (running, finished or upcoming). */
      const list = sprintsOf(s.traineeId), i = list.findIndex(x => x.id === s.id), dir = +el.dataset.dir;
      let j = i + dir;
      while (j >= 0 && j < list.length && list[j].status !== s.status) j += dir;
      if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]];
      list.forEach((x, k) => { if (x.order !== k + 1) put('sprints', Object.assign({}, x, { order: k + 1 })); });
