      --n1: #4A4220; --n2: #4A2433; --n3: #1F4133; --n4: #332C5C;
      --blob1: rgba(165, 151, 255, .10); --blob2: rgba(255, 139, 168, .08); --blob3: rgba(107, 214, 166, .07);
      --av-l: 30%; --av-t: 86%;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17151F; --surface: #211E2C; --surface-2: #2A2638; --line: #37324B;
    --text: #EEEAF6; --muted: #A9A2BC;
    --accent: #A597FF; --accent-ink: #1A1530; --accent-soft: #322B57;
    --ok: #6BD6A6; --ok-soft: #173A2C; --warn: #F0B060; --warn-soft: #3E2C14;
    --bad: #FF8BA8; --bad-soft: #45202C; --info: #7DBDF2; --info-soft: #1C3247;
    --n1: #4A4220; --n2: #4A2433; --n3: #1F4133; --n4: #332C5C;
    --blob1: rgba(165, 151, 255, .10); --blob2: rgba(255, 139, 168, .08); --blob3: rgba(107, 214, 166, .07);
    --av-l: 30%; --av-t: 86%;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    font-family: 'Heebo', system-ui, sans-serif; font-size: 16px; line-height: 1.5;
    color: var(--text); background-color: var(--bg);
    background-image:
      radial-gradient(40rem 30rem at 100% -5%, var(--blob1), transparent 70%),
      radial-gradient(34rem 26rem at -5% 30%, var(--blob2), transparent 70%),
      radial-gradient(38rem 28rem at 60% 110%, var(--blob3), transparent 70%);
    background-attachment: fixed;
  }
  h1, h2, h3 { font-family: 'Rubik', 'Heebo', sans-serif; font-weight: 600; margin: 0; line-height: 1.25; text-wrap: balance; }
  h1 { font-size: 1.6rem; }
  h2 { font-size: 1.15rem; }
  h3 { font-size: 1.05rem; }
  p { margin: 0; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .sm { font-size: .875rem; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; }
  .hidden { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Header ---------- */
  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1160px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 1.15rem; }
  .brand-ico { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); font-size: 1.2rem; }
  .duck-img { display: inline-block; vertical-align: middle; object-fit: contain; }
  .nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { white-space: nowrap; text-decoration: none; color: var(--muted); font-weight: 500; padding: 8px 14px; border-radius: 999px; }
  .nav a:hover { background: var(--surface-2); color: var(--text); }
  .nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .me { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }
  .me-name { display: flex; flex-direction: column; line-height: 1.2; font-weight: 600; font-size: .95rem; }
  .me-name small { color: var(--muted); font-weight: 400; font-size: .78rem; }
  .sync { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); padding: 4px 10px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
  .sync::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .sync.online::before { background: var(--ok); }
  .sync.offline::before, .sync.local::before { background: var(--warn); }
  .sync.error::before { background: var(--bad); }
  @media (max-width: 760px) {
    .top-in { gap: 8px 12px; }
    .nav { order: 3; width: 100%; }
    .me-name, .sync span { display: none; }
    .sync { padding: 6px; }
  }

  .wrap { max-width: 1160px; margin: 0 auto; padding: 24px 16px 64px; }

  /* ---------- Generic pieces ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .card + .card { margin-top: 16px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .eyebrow { font-size: .78rem; color: var(--muted); font-weight: 500; }
  .hint { color: var(--muted); font-size: .875rem; margin-bottom: 12px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 28px 0 12px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .page-head p { color: var(--muted); margin-top: 4px; }
  .link { color: var(--accent); font-weight: 500; font-size: .9rem; text-decoration: none; }
  .link:hover { text-decoration: underline; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 12px; padding: 9px 16px; font-weight: 600; cursor: pointer; text-decoration: none; background: var(--surface-2); color: var(--text); transition: transform .08s, filter .15s; white-space: nowrap; }
  .btn:hover { filter: brightness(.97); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.soft { background: var(--accent-soft); color: var(--accent); }
  .btn.ghost { background: transparent; border-color: var(--line); }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn.sm { padding: 6px 12px; font-size: .875rem; border-radius: 10px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: .95rem; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.info { background: var(--info-soft); color: var(--info); }
  .badge.acc { background: var(--accent-soft); color: var(--accent); }

  .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #ff9ec0)); transition: width .4s; }
  .bar.big { height: 12px; }

  .av { display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 50%; font-family: 'Rubik', sans-serif; font-weight: 700; background: hsl(var(--h) 70% var(--av-l)); color: hsl(var(--h) 50% var(--av-t)); }
  .av.sm { width: 32px; height: 32px; font-size: .85rem; }
  .av.lg { width: 56px; height: 56px; font-size: 1.3rem; }
  .av.xl { width: 120px; height: 120px; font-size: 2.6rem; }
  .av.photo { background: var(--surface-2); overflow: hidden; }
  .av.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .av-btn { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; display: inline-flex; }
  .av-btn:hover .av { box-shadow: 0 0 0 3px var(--accent-soft); }
  .photo-edit { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 8px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field > span { font-weight: 500; font-size: .9rem; }
  .field small { color: var(--muted); font-size: .8rem; }
  input[type=text], input[type=password], input[type=number], input[type=date], select, textarea {
    width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; min-height: 44px;
  }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .check, .field.check { display: flex; flex-direction: row; gap: 8px; align-items: center; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg label { cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; padding: 7px 14px; border-radius: 9px; font-weight: 500; color: var(--muted); }
  .seg input:checked + span { background: var(--surface); color: var(--accent); font-weight: 700; box-shadow: var(--shadow); }
  .seg input:focus-visible + span { outline: 3px solid var(--accent); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: .85rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .chip:hover { color: var(--text); }
  .chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 700; }
  .chip.on.doing { background: var(--info-soft); color: var(--info); }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .big { font-size: 2.6rem; display: block; margin-bottom: 8px; }
  .empty b { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: 4px; }

  /* ---------- Auth screens ---------- */
  .center { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .auth { width: 100%; max-width: 540px; padding: 28px; }
  .auth-hero { text-align: center; margin-bottom: 22px; }
  .auth-hero .hero-ico { font-size: 3rem; display: inline-grid; place-items: center; width: 84px; height: 84px; border-radius: 26px; background: var(--accent-soft); margin-bottom: 12px; }
  .auth-hero p { color: var(--muted); margin-top: 6px; }
  .who-group + .who-group { margin-top: 18px; }
  .who-group h2 { font-size: .9rem; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
  .who { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .who button { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: start; font-weight: 500; }
  .who button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .who button span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picked { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .err { color: var(--bad); font-weight: 500; font-size: .9rem; min-height: 1.4em; margin-bottom: 8px; }
  .note-box { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: .85rem; margin-top: 16px; }

  /* ---------- Trainee page ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
  @media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .hello { margin-bottom: 16px; }
  .hello p { color: var(--muted); margin-top: 4px; }
  .overview .ov-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .ov-num { font-family: 'Rubik', sans-serif; font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .ov-num span { font-size: 1rem; font-weight: 500; color: var(--muted); }
  .ov-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .ov-meta b { color: var(--text); font-weight: 600; }

  .t-head { margin-bottom: 20px; }
  .back { display: inline-block; text-decoration: none; color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
  .back:hover { color: var(--accent); }
  .t-id { display: flex; align-items: center; gap: 14px; }
  .t-id .muted { font-size: .9rem; margin-top: 2px; }
  .tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs a { padding: 10px 16px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs a.on { color: var(--accent); border-color: var(--accent); font-weight: 700; }

  .sprints { display: flex; flex-direction: column; gap: 14px; }
  .sprint { --c: var(--line); background: var(--surface); border: 1px solid var(--line); border-inline-start: 6px solid var(--c); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
  .sprint.st-active { --c: var(--accent); }
  .sprint.st-overdue { --c: var(--bad); }
  .sprint.st-done { --c: var(--ok); }
  .sp-head { display: flex; gap: 12px; align-items: flex-start; }
  .sp-num { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--surface-2); font-family: 'Rubik', sans-serif; font-weight: 700; color: var(--muted); }
  .st-active .sp-num { background: var(--accent-soft); color: var(--accent); }
  .st-overdue .sp-num { background: var(--bad-soft); color: var(--bad); }
  .st-done .sp-num { background: var(--ok-soft); color: var(--ok); }
  .sp-title { flex: 1; min-width: 0; }
  .sp-title p { color: var(--muted); font-size: .9rem; margin-top: 2px; white-space: pre-line; }
  .sp-body { margin-top: 14px; }
  .sp-todo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sp-alloc b { font-family: 'Rubik', sans-serif; font-size: 1.25rem; }
  .sp-alloc span { color: var(--muted); font-size: .9rem; margin-inline-start: 6px; }
  .sp-active { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .sp-facts { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 4px; }
  .big-line { font-family: 'Rubik', sans-serif; font-size: 1.2rem; font-weight: 600; }
  .st-overdue .big-line { color: var(--bad); }
  .facts { color: var(--muted); font-size: .875rem; }
  .sp-facts .row { margin-top: 8px; }
  .ring { position: relative; width: 108px; height: 108px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .trk { stroke: var(--surface-2); }
  .ring .val { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s; }
  .ring.warn .val { stroke: var(--warn); }
  .ring.bad .val { stroke: var(--bad); }
  .ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .ring-in b { font-family: 'Rubik', sans-serif; font-size: 1.7rem; }
  .ring-in span { font-size: .72rem; color: var(--muted); }
  .ring.bad .ring-in b { color: var(--bad); }
  .sp-done { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sp-done > div { flex: 1; min-width: 180px; }
  .sp-done .big-line { font-size: 1.05rem; }
  .done-check { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); font-weight: 700; font-size: 1.2rem; }
  .sp-foot { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .sp-foot:empty { display: none; }
  .tools { margin-inline-start: auto; display: flex; gap: 2px; }
  .exts summary { cursor: pointer; font-size: .875rem; color: var(--warn); font-weight: 500; }
  .exts ul { margin: 6px 0 0; padding-inline-start: 18px; font-size: .875rem; }
  .exts li + li { margin-top: 4px; }
  .exts-box { flex-basis: 100%; }

  /* Upcoming week */
  .days { display: flex; flex-direction: column; gap: 6px; }
  .day { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; border: 1px solid transparent; border-radius: 12px; padding: 8px 12px; cursor: pointer; background: var(--ok-soft); color: var(--text); }
  .day:hover:not(:disabled) { border-color: var(--ok); }
  .day .d-name { font-weight: 700; min-width: 44px; }
  .day .d-num { color: var(--muted); font-size: .85rem; min-width: 38px; }
  .day .d-st { flex: 1; font-size: .85rem; color: var(--ok); font-weight: 500; }
  .day .d-val { font-family: 'Rubik', sans-serif; font-weight: 600; font-size: .85rem; color: var(--ok); background: var(--surface); border-radius: 8px; padding: 0 8px; }
  .day.away { background: var(--bad-soft); }
  .day.away:hover:not(:disabled) { border-color: var(--bad); }
  .day.away .d-st { color: var(--bad); }
  .day.holiday { background: var(--info-soft); cursor: default; }
  .day.holiday .d-st { color: var(--info); }
  .day.weekend { background: transparent; border: 1px dashed var(--line); cursor: default; }
  .day.weekend .d-st { color: var(--muted); }
  .day:disabled { cursor: default; }
  .day.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 4px; vertical-align: -1px; }

  /* Notes */
  .note-form textarea { min-height: 64px; border-radius: 14px; }
  .note-tools { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .swatch input { position: absolute; opacity: 0; }
  .swatch span { display: block; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
  .swatch input:checked + span { box-shadow: 0 0 0 2px var(--accent); }
  .swatch input:focus-visible + span { outline: 3px solid var(--accent); }
  .emo { border: 0; background: transparent; font-size: 1.1rem; cursor: pointer; padding: 2px; border-radius: 8px; }
  .emo:hover { background: var(--surface-2); }
  .notes { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; padding: 4px; }
  .note { position: relative; padding: 12px 14px 10px; border-radius: 4px 16px 16px 16px; background: var(--n1); transform: rotate(-.6deg); box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  .note:nth-child(even) { transform: rotate(.6deg); border-radius: 16px 4px 16px 16px; }
  .note.c2 { background: var(--n2); } .note.c3 { background: var(--n3); } .note.c4 { background: var(--n4); }
  .note p { white-space: pre-wrap; overflow-wrap: anywhere; }
  .note .by { font-size: .78rem; color: var(--muted); margin-top: 6px; display: flex; gap: 6px; align-items: center; }
  .note .x { position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; font-size: .8rem; opacity: .5; }
  .note .x:hover { opacity: 1; }
  .note.new::after { content: 'חדש!'; position: absolute; top: -8px; right: 12px; background: var(--accent); color: var(--accent-ink); font-size: .7rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .sw1 { background: var(--n1); } .sw2 { background: var(--n2); } .sw3 { background: var(--n3); } .sw4 { background: var(--n4); }

  /* Questions */
  .q-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
  .q-group { margin-top: 18px; }
  .q-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .q-group-head .bar { flex: 1; min-width: 80px; max-width: 200px; }
  .qs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .q { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid transparent; }
  .q.q-doing { background: var(--info-soft); }
  .q.q-done .q-text { text-decoration: line-through; color: var(--muted); }
  .q-check { flex: none; width: 26px; height: 26px; margin-top: 1px; border-radius: 8px; border: 2px solid var(--muted); background: var(--surface); cursor: pointer; display: grid; place-items: center; font-weight: 700; color: #fff; }
  .q-check:hover:not(:disabled) { border-color: var(--ok); }
  .q-done .q-check { background: var(--ok); border-color: var(--ok); }
  .q-check:disabled { cursor: default; }
  .q-main { flex: 1; min-width: 0; }
  .q-text { overflow-wrap: anywhere; }
  .q-note { font-size: .85rem; color: var(--muted); margin-top: 2px; white-space: pre-wrap; }
  .q-meta { font-size: .78rem; color: var(--muted); }
  .q-actions { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .q-add { display: flex; gap: 8px; margin-top: 8px; }
  .q-add input { flex: 1; min-height: 40px; }
  @media (max-width: 640px) { .q { flex-wrap: wrap; } .q-actions { width: 100%; justify-content: flex-start; padding-inline-start: 38px; } }

  /* Calendar */
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .cal-head h2 { flex: 1; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal-dow { text-align: center; font-size: .8rem; color: var(--muted); font-weight: 600; padding-bottom: 2px; }
  .cell { position: relative; min-height: 88px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 6px; text-align: start; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  button.cell { cursor: pointer; }
  button.cell:hover { border-color: var(--accent); }
  .cell.blank { border: 0; background: transparent; }
  .cell.weekend { background: transparent; border-style: dashed; }
  .cell.away { background: var(--bad-soft); border-color: transparent; }
  .cell.holiday { background: var(--info-soft); border-color: transparent; }
  .cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cell .c-top { display: flex; justify-content: space-between; align-items: center; }
  .cell .c-n { font-weight: 700; font-size: .9rem; }
  .cell.weekend .c-n { color: var(--muted); font-weight: 500; }
  .cell .c-v { font-size: .7rem; color: var(--muted); }
  .cell .c-lbl { font-size: .72rem; font-weight: 600; color: var(--bad); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell.holiday .c-lbl { color: var(--info); }
  .ev { font-size: .7rem; border-radius: 6px; padding: 1px 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
  .ev.due { background: var(--warn-soft); color: var(--warn); }
  .ev.late { background: var(--bad-soft); color: var(--bad); }
  .ev.done { background: var(--ok-soft); color: var(--ok); }
  @media (max-width: 640px) {
    .cal-grid { gap: 3px; }
    .cell { min-height: 54px; padding: 4px; border-radius: 8px; }
    .cell .c-lbl, .cell .c-v { display: none; }
    .ev { font-size: 0; padding: 0; height: 5px; }
  }
  .marked { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .marked li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface-2); border-radius: 10px; font-size: .9rem; }
  .marked li span.grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Home cards */
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .tcard { display: flex; flex-direction: column; gap: 14px; text-decoration: none; color: var(--text); transition: transform .12s, border-color .12s; }
  .tcard:hover { transform: translateY(-2px); border-color: var(--accent); }
  .tcard + .tcard { margin-top: 0; }
  .tc-head { display: flex; align-items: center; gap: 12px; }
  .tc-head > div { flex: 1; min-width: 0; }
  .tc-stage { display: flex; flex-direction: column; gap: 2px; }
  .tc-stage b { font-weight: 600; }
  .tc-stage .t { font-size: .875rem; color: var(--muted); }
  .tc-stage .t.bad { color: var(--bad); font-weight: 600; }
  .tc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); flex-wrap: wrap; }
  .unread { background: var(--accent); color: var(--accent-ink); font-size: .78rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; }

  /* Reports */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .tile { padding: 16px 18px; }
  .tile + .tile { margin-top: 0; }
  .tile .v { font-family: 'Rubik', sans-serif; font-size: 2rem; font-weight: 700; line-height: 1.1; margin-top: 4px; }
  .tile.bad .v { color: var(--bad); }
  .tile.warn .v { color: var(--warn); }
  .tile.ok .v { color: var(--ok); }
  .alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .alerts li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: .92rem; }
  .alerts li.bad { background: var(--bad-soft); }
  .alerts li.warn { background: var(--warn-soft); }
  .alerts li .ai { flex: none; }
  .tbl-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .tbl th { text-align: start; font-weight: 600; color: var(--muted); font-size: .8rem; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl td.nw { white-space: nowrap; }
  .tbl a.tn { display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .tbl a.tn:hover { color: var(--accent); }
  .mx td, .mx th { text-align: center; }
  .mx td:first-child, .mx th:first-child { text-align: start; }
  .mc { display: inline-block; min-width: 64px; padding: 4px 8px; border-radius: 8px; font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mc.ok { background: var(--ok-soft); color: var(--ok); }
  .mc.bad { background: var(--bad-soft); color: var(--bad); }
  .mc.info { background: var(--info-soft); color: var(--info); }
  .mc.none { color: var(--muted); }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .two .card + .card { margin-top: 0; }
  @media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }

  /* Users / plan */
  .nu-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 16px; align-items: end; }
  .nu-form .full { grid-column: 1 / -1; }
  .nu-form:has(#nu-role-m:checked) .trainee-only { display: none; }
  .plan-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .plan-item { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: var(--surface-2); }
  .plan-item .grow { min-width: 0; }
  .plan-item p { color: var(--muted); font-size: .9rem; white-space: pre-line; }
  .plan-item details { margin-top: 6px; font-size: .9rem; }
  .plan-item summary { cursor: pointer; color: var(--accent); font-weight: 500; }
  .plan-item ol { margin: 6px 0 0; padding-inline-start: 20px; }

  /* Trainee "now" card and journey */
  .now { padding: 22px; }
  .now-title { font-size: 1.45rem; margin: 4px 0 2px; }
  .now-body { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .now-body .bar { max-width: 360px; margin: 6px 0 2px; }
  .journey { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .journey li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .j-dot { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
  .journey.done li { background: transparent; }
  .journey.done .j-dot { border: 0; background: var(--ok-soft); color: var(--ok); }
  .talk-card h2 { margin-bottom: 6px; }
  .talk-card { background: var(--accent-soft); border-color: transparent; }
  .banner { display: flex; flex-direction: column; gap: 4px; background: var(--warn-soft); color: var(--text); border-radius: 14px; padding: 12px 16px; margin-bottom: 18px; }

  /* Mentor focus card */
  .mgr-focus h2 { font-size: 1.3rem; margin-top: 2px; }
  .mgr-focus.is-late { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad-soft), var(--shadow); }
  .mf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .mf-grid > div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .mf-grid b { font-family: 'Rubik', sans-serif; font-size: 1.1rem; font-weight: 600; }
  .bad-t { color: var(--bad); }
  .grp-title { margin: 22px 0 10px; }
  .unread.warn-b { background: var(--warn); color: #fff; }
  .day.half { background: var(--warn-soft); }
  .day.half .d-st { color: var(--warn); }
  .day.half .d-val { color: var(--warn); }
  .cell.half { background: var(--warn-soft); border-color: transparent; }
  .cell.half .c-lbl { color: var(--warn); }

  .sp-sec { font-size: .95rem; color: var(--muted); margin: 8px 0 -4px; }

  /* Issues */
  .pick-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
  .pick-list .check { align-items: flex-start; }
  .pick-list input:disabled + span { opacity: .55; }
  .code-pill { display: inline-block; margin-inline-start: 6px; padding: 2px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: .85rem; }
  .code-pill b { letter-spacing: .12em; }
  .rep-sec + .rep-sec { margin-top: 16px; }
  .rep-q { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .rep-q > li { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
  .rep-row { display: flex; align-items: center; gap: 10px; }
  .rep-row span.grow { overflow-wrap: anywhere; }
  .rep-q .issue { margin-top: 8px; }
  .issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .issue { padding: 12px 14px; border-radius: 14px; background: var(--warn-soft); }
  .issue.res { background: var(--surface-2); }
  .issue p { margin: 6px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .is-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .is-about { font-size: .85rem; font-weight: 600; color: var(--muted); }
  .is-reply { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--surface); font-size: .9rem; }

  /* Attendance */
  .att-tbl th, .att-tbl td { text-align: center; }
  .att-tbl th:first-child, .att-tbl td:first-child { text-align: start; }
  .att-tbl th.is-today { color: var(--accent); }
  .att { font-weight: 700; white-space: nowrap; }
  .att.in { color: var(--ok); }
  .att.away { color: var(--bad); background: var(--bad-soft); }
  .att.half { color: var(--warn); background: var(--warn-soft); }
  .att.hol { color: var(--info); background: var(--info-soft); }
  .att-n { display: block; font-weight: 400; font-size: .75rem; }

  /* Dialog */
  dialog { border: 0; border-radius: 22px; padding: 0; width: min(480px, calc(100vw - 32px)); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(30, 24, 50, .45); backdrop-filter: blur(3px); }
  .dlg-form { padding: 22px; }
  .dlg-form h2 { font-size: 1.25rem; margin-bottom: 16px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-start; margin-top: 8px; }
  .dlg-prev { background: var(--accent-soft); color: var(--accent); border-radius: 12px; padding: 10px 14px; font-size: .9rem; font-weight: 500; margin-bottom: 14px; }
  .dlg-prev:empty { display: none; }
  .dlg-note { background: var(--info-soft); color: var(--info); border-radius: 12px; padding: 10px 14px; font-size: .9rem; font-weight: 500; margin-bottom: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  #fx span { position: fixed; top: -40px; font-size: 26px; pointer-events: none; z-index: 60; animation: fall 2.1s cubic-bezier(.3,.6,.6,1) forwards; }
  @keyframes fall { to { transform: translate(var(--x), 110vh) rotate(var(--r)); } }
  .loader { font-size: 2.4rem; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="fx" aria-hidden="true"></div>
<script src="firebase-config.js"></script>
<script>
(function () {
  'use strict';

  /* ================= Storage ================= */
  const FIREBASE_VERSION = '10.14.1';
  const cfg = window.FIREBASE_CONFIG;
  /* ?demo=admin|mentor|trainee opens sample data that lives only in memory: nothing is saved or synced. */
  const DEMO = ['admin', 'mentor', 'trainee'].indexOf(new URLSearchParams(location.search).get('demo')) >= 0 ? new URLSearchParams(location.search).get('demo') : null;
  const useCloud = !DEMO && !!(cfg && typeof cfg === 'object' && cfg.projectId && cfg.apiKey);
  const memStore = {};
  const COLS = ['users', 'sprints', 'questions', 'messages', 'absences', 'settings', 'issues', 'talks', 'photos'];
  const LS_DB = 'hafifa_db_v1', LS_SESSION = 'hafifa_session', LS_SEEN = 'hafifa_seen';

  const app = document.getElementById('app');
  const $ = id => document.getElementById(id);

  function emptyDb() { const d = {}; COLS.forEach(c => { d[c] = {}; }); return d; }
  let db = emptyDb();
  let ready = !useCloud;
  let loadError = null;
  let cloud = null;
  let syncState = useCloud ? 'connecting' : 'local';

  function lsGet(k, fb) { if (DEMO) return k in memStore ? JSON.parse(memStore[k]) : fb; try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch (e) { return fb; } }
  function lsSet(k, v) { if (DEMO) { memStore[k] = JSON.stringify(v); return; } try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k) { if (DEMO) { delete memStore[k]; return; } try { localStorage.removeItem(k); } catch (e) {} }
  function loadLocal() { const d = lsGet(LS_DB, null); db = emptyDb(); if (d) COLS.forEach(c => { if (d[c]) db[c] = d[c]; }); }

  function cloudFail(err) { syncState = 'error'; toast('השינוי נשמר במכשיר וישלח כשהחיבור יחזור'); console.warn(err); scheduleRender(); }
  function put(col, obj) {
    db[col][obj.id] = obj;
    if (!useCloud && !DEMO) lsSet(LS_DB, db);
    if (cloud) cloud.set(col, obj).catch(cloudFail);
    scheduleRender();
  }
  function del(col, id) {
    delete db[col][id];
    if (!useCloud && !DEMO) lsSet(LS_DB, db);
    if (cloud) cloud.remove(col, id).catch(cloudFail);
    scheduleRender();
  }

  /* ---------- Firebase: real sign-in (Authentication) + shared data (Firestore) ----------
     Each person signs in with a hidden e-mail built from their user id and a "generation" number,
     e.g. "k3x9ab.0@example.com" (example.com is reserved, so nothing is ever sent anywhere).
     Resetting a password bumps the generation, so the person makes a fresh account with a new one-time code.
     Public (readable before sign-in): hafifa_names (names for the login list), hafifa_claims (who has signed up), hafifa_setup/owner.
     Everything else needs a signed-in, claimed account; see the rules in README. */
  let fb = null, authUser = null, authReady = false, dataStarted = false, claiming = false, unsubs = [];
  const pub = { names: {}, claims: {}, invites: {}, photos: {}, owner: undefined, namesLoaded: false, claimsLoaded: false };
  const LOGIN_DOMAIN = 'example.com';
  /* Firebase requires at least 6 characters. */
  const PW_MIN = useCloud ? 6 : 4;
  const emailFor = (id, gen) => id + '.' + (gen || 0) + '@' + LOGIN_DOMAIN;
  const idFromEmail = e => String(e || '').split('@')[0].split('.')[0];
  const newCode = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return String(100000 + (a[0] % 900000)); };

  function dataErr(err) {
    console.error(err);
    syncState = 'error';
    if (!ready) loadError = err && err.code === 'permission-denied' ? 'rules' : 'other';
    scheduleRender();
  }
  async function initCloud() {
    try {
      const base = 'https://www.gstatic.com/firebasejs/' + FIREBASE_VERSION + '/';
      const appMod = await import(base + 'firebase-app.js');
      const fs = await import(base + 'firebase-firestore.js');
      const am = await import(base + 'firebase-auth.js');
      const fapp = appMod.initializeApp(cfg);
      /* Memory cache only: after signing out, nothing of the onboarding stays on a shared computer. */
      const fdb = fs.getFirestore(fapp);
      const au = am.getAuth(fapp);
      const colRef = c => fs.collection(fdb, 'hafifa_' + c);
      fb = { fs, am, fdb, au, colRef };
      cloud = {
        set: (c, o) => fs.setDoc(fs.doc(colRef(c), o.id), JSON.parse(JSON.stringify(o))),
        remove: (c, id) => fs.deleteDoc(fs.doc(colRef(c), id))
      };
      const intoMap = snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = Object.assign({}, d.data(), { id: d.id }); }); return m; };
      /* Profile photos are public so they can show on the login screen. */
      fs.onSnapshot(colRef('photos'), snap => { pub.photos = intoMap(snap); scheduleRender(); }, err => console.warn(err));
      fs.onSnapshot(colRef('names'), { includeMetadataChanges: true }, snap => {
        pub.names = intoMap(snap); if (!snap.metadata.fromCache) pub.namesLoaded = true; scheduleRender();
      }, dataErr);
      fs.onSnapshot(colRef('claims'), { includeMetadataChanges: true }, snap => {
        pub.claims = intoMap(snap); if (!snap.metadata.fromCache) pub.claimsLoaded = true; checkClaim(); scheduleRender();
      }, dataErr);
      fs.onSnapshot(fs.doc(colRef('setup'), 'owner'), { includeMetadataChanges: true }, snap => {
        if (snap.metadata.fromCache && !snap.exists()) return;
        pub.owner = snap.exists() ? snap.data() : null; scheduleRender();
      }, dataErr);
      am.onAuthStateChanged(au, user => {
        stopData();
        authUser = user; authReady = true;
        if (user) lsSet(LS_SESSION, idFromEmail(user.email)); else lsDel(LS_SESSION);
        checkClaim(); scheduleRender();
      });
    } catch (e) {
      console.error(e); loadError = 'other'; scheduleRender();
    }
  }
  function stopData() { unsubs.forEach(u => u()); unsubs = []; dataStarted = false; ready = false; db = emptyDb(); pub.invites = {}; }
  /* Start reading data once this browser's account is the one that claimed the name; an outdated account (after a reset) is signed out. */
  function checkClaim() {
    if (!fb || !authUser || dataStarted || claiming || !pub.claimsLoaded) return;
    const id = idFromEmail(authUser.email), c = pub.claims[id];
    if (c && c.uid === authUser.uid) startData(id);
    else fb.am.signOut(fb.au);
  }
  function startData(id) {
    const { fs, colRef } = fb;
    dataStarted = true;
    const listen = (ref, apply) => unsubs.push(fs.onSnapshot(ref, { includeMetadataChanges: true }, snap => {
      apply(snap); syncState = snap.metadata.fromCache ? 'offline' : 'online'; scheduleRender();
    }, dataErr));
    const intoDb = c => snap => { const m = {}; snap.docs.forEach(d => { const x = d.data(); x.id = d.id; m[x.id] = x; }); db[c] = m; };
    let rest = false;
    listen(colRef('users'), snap => {
      intoDb('users')(snap);
      if (!snap.metadata.fromCache || snap.size) ready = true;
      const u = db.users[id];
      if (!u || rest) return;
      rest = true;
      if (u.role === 'trainee') {
        /* A trainee may only read their own records, so every query is limited to them. */
        ['sprints', 'questions', 'messages', 'issues', 'talks'].forEach(c => listen(fs.query(colRef(c), fs.where('traineeId', '==', id)), intoDb(c)));
        [id, '_global'].forEach(k => listen(fs.doc(colRef('absences'), k), snap => {
          if (snap.exists()) db.absences[k] = Object.assign({}, snap.data(), { id: k }); else delete db.absences[k];
        }));
        listen(colRef('settings'), intoDb('settings'));
      } else {
        COLS.filter(c => c !== 'users' && c !== 'photos').forEach(c => listen(colRef(c), intoDb(c)));
        if (u.role === 'admin') listen(colRef('invites'), snap => { pub.invites = {}; snap.docs.forEach(d => { pub.invites[d.id] = d.data(); }); });
      }
    });
  }
  /* Writes to the sign-in collections (names, claims, invites), which are not part of the app data. */
  function pubSet(c, id, data) { return fb.fs.setDoc(fb.fs.doc(fb.colRef(c), id), data).catch(cloudFail); }
  function pubDel(c, id) { return fb.fs.deleteDoc(fb.fs.doc(fb.colRef(c), id)).catch(cloudFail); }

  function authError(e) {
    const c = (e && e.code) || '';
    if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/invalid-login-credentials') return 'הסיסמה לא נכונה 🙈';
    if (c === 'auth/weak-password') return 'הסיסמה צריכה להיות לפחות 6 תווים';
    if (c === 'auth/too-many-requests') return 'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות';
    if (c === 'auth/network-request-failed') return 'אין חיבור לאינטרנט';
    if (c === 'auth/operation-not-allowed' || c === 'auth/configuration-not-found') return 'צריך להפעיל ב-Firebase את Authentication ← Email/Password (ראו README)';
